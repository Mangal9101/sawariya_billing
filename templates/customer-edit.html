{% extends 'base.html' %}

{% block content %}

<style>

/* =========================================================
   CUSTOMER EDIT PAGE
   ========================================================= */

.customer-edit-page {

    width: 100%;

    min-height: calc(100vh - 116px);

    background: #f5f7fa;

    padding: 20px 16px 90px;

    box-sizing: border-box;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.customer-edit-container {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.customer-edit-header {

    margin-bottom: 16px;
}


.customer-edit-header h1 {

    margin: 0;

    font-size: 27px;

    color: #222;
}


.customer-edit-header p {

    margin: 6px 0 0;

    font-size: 14px;

    color: #777;
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.back-customer-button {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    min-height: 48px;

    margin-bottom: 14px;

    border: 1px solid #d8dce0;

    border-radius: 10px;

    background: #fff;

    color: #0759a8;

    text-decoration: none;

    font-size: 15px;

    font-weight: 700;

    box-sizing: border-box;
}


.back-customer-button:active {

    transform: scale(.98);

}


/* =========================================================
   EDIT CARD
   ========================================================= */

.customer-edit-card {

    width: 100%;

    background: #fff;

    border: 1px solid #dcdfe3;

    border-radius: 15px;

    padding: 18px 16px 20px;

    box-sizing: border-box;

    box-shadow:
        0 2px 8px rgba(0,0,0,.05);
}


/* =========================================================
   CUSTOMER INFO
   ========================================================= */

.customer-edit-info {

    padding: 14px;

    margin-bottom: 18px;

    background: #f8f4f1;

    border-radius: 11px;

    border: 1px solid #e6e1de;
}


.customer-edit-info-label {

    display: block;

    margin-bottom: 5px;

    color: #625950;

    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;
}


.customer-edit-info-name {

    color: #222;

    font-size: 19px;

    font-weight: 700;
}


/* =========================================================
   FORM
   ========================================================= */

.customer-edit-form {

    width: 100%;
}


.customer-edit-form label {

    display: block;

    margin-bottom: 7px;

    color: #444;

    font-size: 14px;

    font-weight: 700;
}


.customer-edit-form input {

    width: 100%;

    height: 52px;

    margin-bottom: 15px;

    padding: 0 13px;

    border: 1px solid #d8dce0;

    border-radius: 9px;

    outline: none;

    background: #fff;

    color: #333;

    font-size: 15px;

    box-sizing: border-box;
}


.customer-edit-form input:focus {

    border-color: #0759a8;

    box-shadow:
        0 0 0 2px rgba(7,89,168,.08);
}


/* =========================================================
   SAVE BUTTON
   ========================================================= */

.update-customer-button {

    width: 100%;

    min-height: 52px;

    border: 0;

    border-radius: 10px;

    background: #0759a8;

    color: #fff;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 3px 10px rgba(7,89,168,.20);
}


.update-customer-button:active {

    transform: scale(.98);

}


/* =========================================================
   DELETE SECTION
   ========================================================= */

.delete-section {

    margin-top: 18px;

    padding-top: 18px;

    border-top: 1px solid #eeeeee;
}


.delete-title {

    margin: 0 0 5px;

    color: #333;

    font-size: 15px;

    font-weight: 700;
}


.delete-description {

    margin: 0 0 12px;

    color: #777;

    font-size: 13px;

    line-height: 19px;
}


.delete-customer-button {

    width: 100%;

    min-height: 50px;

    border: 0;

    border-radius: 10px;

    background: #dc3545;

    color: #fff;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}


.delete-customer-button:active {

    transform: scale(.98);

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 701px) {

    .customer-edit-page {

        padding-left: 20px;

        padding-right: 20px;

    }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .customer-edit-page {

        padding-left: 10px;

        padding-right: 10px;

    }


    .customer-edit-header h1 {

        font-size: 25px;

    }


    .customer-edit-card {

        padding:
            16px 13px 18px;

    }

}

</style>


<!-- =========================================================
     CUSTOMER EDIT PAGE
     ========================================================= -->

<div class="customer-edit-page">


    <div class="customer-edit-container">


        <!-- =================================================
             HEADER
             ================================================= -->

        <div class="customer-edit-header">

            <h1>
                Edit Customer
            </h1>

            <p>
                Update customer name, mobile number and address.
            </p>

        </div>


        <!-- =================================================
             BACK
             ================================================= -->

        <a
            href="/customers"
            class="back-customer-button"
        >
            ← Back to Customers
        </a>


        <!-- =================================================
             EDIT CARD
             ================================================= -->

        <section class="customer-edit-card">


            <!-- =================================================
                 CUSTOMER NAME INFO
                 ================================================= -->

            <div class="customer-edit-info">

                <span class="customer-edit-info-label">
                    Editing Customer
                </span>

                <div class="customer-edit-info-name">

                    {{ customer.name }}

                </div>

            </div>


            <!-- =================================================
                 UPDATE FORM
                 ================================================= -->

            <form
                method="post"
                action="/customers/{{ customer.id }}/update"
                class="customer-edit-form"
            >


                <!-- NAME -->

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    name="name"
                    value="{{ customer.name }}"
                    placeholder="Customer Name"
                    required
                    autocomplete="name"
                >


                <!-- PHONE -->

                <label for="customerPhone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="customerPhone"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                    placeholder="Mobile Number"
                    autocomplete="tel"
                >


                <!-- ADDRESS -->

                <label for="customerAddress">
                    Address
                </label>

                <input
                    type="text"
                    id="customerAddress"
                    name="address"
                    value="{{ customer.address or '' }}"
                    placeholder="Address"
                    autocomplete="street-address"
                >


                <!-- SAVE -->

                <button
                    type="submit"
                    class="update-customer-button"
                >
                    💾 Update Customer
                </button>


            </form>


            <!-- =================================================
                 DELETE
                 ================================================= -->

            <div class="delete-section">

                <h3 class="delete-title">
                    Delete Customer
                </h3>

                <p class="delete-description">

                    Customer delete करने से पहले सुनिश्चित करें
                    कि इस customer को आगे records में जरूरत नहीं है।

                </p>


                <form
                    method="post"
                    action="/customers/{{ customer.id }}/delete"
                    onsubmit="return confirmDeleteCustomer();"
                >

                    <button
                        type="submit"
                        class="delete-customer-button"
                    >
                        🗑 Delete Customer
                    </button>

                </form>

            </div>


        </section>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

function confirmDeleteCustomer() {

    return confirm(
        "क्या आप इस customer को delete करना चाहते हैं?"
    );

}

</script>


{% endblock %}
