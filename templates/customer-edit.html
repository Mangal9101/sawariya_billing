{% extends 'base.html' %}

{% block content %}

<main>


<!-- =========================================================
     PAGE HEADER
     ========================================================= -->

<div class="top">

    <div>

        <h1>Edit Customer</h1>

        <p>Update customer details.</p>

    </div>

</div>


<!-- =========================================================
     EDIT CUSTOMER PANEL
     ========================================================= -->

<section class="panel customer-edit-panel">


    <div class="customer-edit-title">

        <div>

            <h2>Customer Details</h2>

            <p>
                Change the customer information below.
            </p>

        </div>


        <a
            href="/customers"
            class="cancel-edit-btn"
        >
            ← Back
        </a>

    </div>


    <!-- =====================================================
         UPDATE FORM
         ===================================================== -->

    <form
        method="post"
        action="/customers/{{ customer.id }}/update"
        class="formgrid"
    >


        <!-- CUSTOMER NAME -->

        <input
            type="text"
            name="name"
            value="{{ customer.name or '' }}"
            placeholder="Customer name"
            required
            autocomplete="name"
        >


        <!-- MOBILE -->

        <input
            type="tel"
            name="phone"
            value="{{ customer.phone or '' }}"
            placeholder="Mobile number"
            autocomplete="tel"
        >


        <!-- ADDRESS -->

        <input
            type="text"
            name="address"
            value="{{ customer.address or '' }}"
            placeholder="Address"
            autocomplete="street-address"
        >


        <!-- SAVE -->

        <button
            type="submit"
            class="btn save-customer-btn"
        >
            ✅ Save / Update Customer
        </button>


    </form>


    <!-- =====================================================
         DELETE
         ===================================================== -->

    <form
        method="post"
        action="/customers/{{ customer.id }}/delete"
        class="delete-customer-form"
        onsubmit="return confirmDeleteCustomer();"
    >

        <button
            type="submit"
            class="delete-customer-btn"
        >
            🗑 Delete Customer
        </button>

    </form>


</section>


</main>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

function confirmDeleteCustomer() {

    return confirm(
        "Are you sure you want to delete this customer?"
    );

}

</script>


<!-- =========================================================
     CUSTOMER EDIT CSS
     ========================================================= -->

<style>


/* =========================================================
   EDIT PANEL
   ========================================================= */

.customer-edit-panel {

    max-width: 700px;

    margin-left: auto;

    margin-right: auto;

}


/* =========================================================
   EDIT TITLE
   ========================================================= */

.customer-edit-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}


.customer-edit-title h2 {

    margin: 0 0 4px;

    font-size: 20px;

}


.customer-edit-title p {

    margin: 0;

    opacity: .7;

    font-size: 14px;

}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.cancel-edit-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 42px;

    padding: 9px 15px;

    border: 1px solid #dddddd;

    border-radius: 8px;

    background: #ffffff;

    color: #555555;

    text-decoration: none;

    font-weight: 700;

    box-sizing: border-box;

}


.cancel-edit-btn:hover {

    background: #f5f5f5;

}


/* =========================================================
   SAVE BUTTON
   ========================================================= */

.save-customer-btn {

    min-height: 46px;

    font-weight: 700;

    cursor: pointer;

}


/* =========================================================
   DELETE FORM
   ========================================================= */

.delete-customer-form {

    margin-top: 12px;

}


/* =========================================================
   DELETE BUTTON
   ========================================================= */

.delete-customer-btn {

    width: 100%;

    min-height: 46px;

    border: 1px solid #dc3545;

    border-radius: 8px;

    background: #fff5f5;

    color: #dc3545;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

}


.delete-customer-btn:hover {

    background: #ffe8e8;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {


    .customer-edit-panel {

        width: 100%;

        box-sizing: border-box;

    }


    .customer-edit-title {

        align-items: stretch;

        flex-direction: column;

    }


    .cancel-edit-btn {

        width: 100%;

        min-height: 46px;

    }


    .save-customer-btn {

        width: 100%;

        min-height: 50px;

        font-size: 16px;

    }


    .delete-customer-btn {

        min-height: 50px;

        font-size: 16px;

    }

}

</style>


{% endblock %}
