<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <meta name="theme-color" content="#24150d">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet"
          href="/static/css/style.css">

    <title>{{ title or 'Sawariya Confectionary' }}</title>


    <style>

        /* =========================================================
           RESET / LAYOUT
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            padding-left: 250px;
            background: #f7f5f2;
        }


        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sw-sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background: #24150d;

            color: #fff;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            border-right:
                1px solid rgba(255,255,255,.06);

            transition:
                transform .28s ease;
        }


        /* =========================================================
           BRAND
           ========================================================= */

        .sw-brand {

            height: 92px;

            padding: 0 22px;

            display: flex;

            align-items: center;

            gap: 12px;

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }


        .sw-brand-icon {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #7b3f18;

            font-size: 22px;

            box-shadow:
                0 5px 14px
                rgba(0,0,0,.25);
        }


        .sw-brand-name {

            font-size: 20px;

            font-weight: 900;

            letter-spacing: 1.3px;

            line-height: 1;
        }


        .sw-brand-sub {

            margin-top: 6px;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 1.2px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,.45);
        }


        /* =========================================================
           SECTION LABEL
           ========================================================= */

        .sw-section-title {

            padding:
                24px 22px 9px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.6px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,.35);
        }


        /* =========================================================
           NAV
           ========================================================= */

        .sw-nav {

            flex: 1;

            overflow-y: auto;

            padding:
                0 12px 15px;

            scrollbar-width: none;
        }

        .sw-nav::-webkit-scrollbar {
            display: none;
        }


        .sw-nav a {

            position: relative;

            height: 48px;

            margin-bottom: 3px;

            padding: 0 12px;

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            color:
                rgba(255,255,255,.62);

            font-size: 13px;

            font-weight: 600;

            border-left:
                3px solid transparent;

            transition:
                color .18s ease,
                background .18s ease,
                border-color .18s ease;
        }


        .sw-nav a:hover {

            color: #fff;

            background:
                rgba(255,255,255,.055);
        }


        /* =========================================================
           ICON
           ========================================================= */

        .sw-icon {

            width: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 17px;

            opacity: .82;
        }


        .sw-nav a:hover .sw-icon {

            opacity: 1;
        }


        /* =========================================================
           ACTIVE
           ========================================================= */

        .sw-nav a.active {

            color: #fff;

            background:
                rgba(166,93,39,.22);

            border-left-color:
                #c98245;
        }


        .sw-nav a.active .sw-icon {

            opacity: 1;
        }


        /* =========================================================
           DIVIDER
           ========================================================= */

        .sw-divider {

            height: 1px;

            margin:
                13px 12px;

            background:
                rgba(255,255,255,.08);
        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        .sw-logout {

            color:
                rgba(255,200,190,.62) !important;
        }


        .sw-logout:hover {

            color: #fff !important;

            background:
                rgba(190,60,45,.12) !important;
        }


        /* =========================================================
           SIDEBAR FOOTER
           ========================================================= */

        .sw-sidebar-footer {

            padding:
                14px 18px 18px;

            border-top:
                1px solid rgba(255,255,255,.08);
        }


        .sw-status {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 10px;

            font-weight: 600;

            color:
                rgba(255,255,255,.48);
        }


        .sw-status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #38b96b;

            box-shadow:
                0 0 0 3px
                rgba(56,185,107,.12);
        }


        /* =========================================================
           TOP HEADER
           ========================================================= */

        .sw-topbar {

            position: sticky;

            top: 0;

            height: 70px;

            width: 100%;

            background:
                rgba(255,255,255,.96);

            border-bottom:
                1px solid #e8e4df;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 8000;
        }


        /* =========================================================
           CENTER BRAND
           ========================================================= */

        .sw-center-brand {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #7b3f18;

            font-size: 22px;

            font-weight: 900;

            letter-spacing: 2px;
        }


        .sw-center-brand-icon {

            font-size: 20px;
        }


        /* =========================================================
           MOBILE MENU BUTTON
           ========================================================= */

        .sw-menu-button {

            display: none;

            position: absolute;

            left: 12px;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 10px;

            background: #24150d;

            color: #fff;

            font-size: 22px;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }


        /* =========================================================
           OVERLAY
           ========================================================= */

        .sw-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.50);

            z-index: 9998;

            opacity: 0;

            transition:
                opacity .25s ease;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            body {
                padding-left: 0;
            }


            .sw-topbar {

                height: 58px;
            }


            .sw-center-brand {

                font-size: 18px;

                letter-spacing: 1.3px;
            }


            .sw-center-brand-icon {

                font-size: 17px;
            }


            .sw-menu-button {

                display: flex;
            }


            .sw-sidebar {

                width: 285px;

                transform:
                    translateX(-100%);

                box-shadow:
                    8px 0 30px
                    rgba(0,0,0,.28);
            }


            .sw-sidebar.open {

                transform:
                    translateX(0);
            }


            .sw-overlay {

                display: block;

                pointer-events: none;
            }


            .sw-overlay.open {

                opacity: 1;

                pointer-events: auto;
            }


            .sw-brand {

                height: 86px;

                padding-left: 20px;
            }

        }


        /* =========================================================
           SMALL MOBILE
           ========================================================= */

        @media (max-width: 380px) {

            .sw-sidebar {

                width: 275px;
            }


            .sw-center-brand {

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     TOP HEADER
     ========================================================= -->

<header class="sw-topbar">


    <button
        type="button"
        class="sw-menu-button"
        id="swMenuButton"
        aria-label="Open menu"
        aria-expanded="false">

        ☰

    </button>


    <div class="sw-center-brand">

        <span class="sw-center-brand-icon">
            🍬
        </span>

        <span>
            SAWARIYA
        </span>

    </div>

</header>



<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<aside
    class="sw-sidebar"
    id="swSidebar">


    <!-- BRAND -->

    <div class="sw-brand">

        <div class="sw-brand-icon">
            🍬
        </div>

        <div>

            <div class="sw-brand-name">
                SAWARIYA
            </div>

            <div class="sw-brand-sub">
                Confectionary Billing
            </div>

        </div>

    </div>



    <!-- MENU TITLE -->

    <div class="sw-section-title">
        Menu
    </div>



    <!-- NAVIGATION -->

    <nav class="sw-nav">


        <a
            href="/dashboard"
            data-path="/dashboard">

            <span class="sw-icon">
                🏠
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <a
            href="/billing"
            data-path="/billing">

            <span class="sw-icon">
                🧾
            </span>

            <span>
                Billing
            </span>

        </a>


        <a
            href="/products"
            data-path="/products">

            <span class="sw-icon">
                📦
            </span>

            <span>
                Products
            </span>

        </a>


        <a
            href="/stock"
            data-path="/stock">

            <span class="sw-icon">
                📊
            </span>

            <span>
                Stock
            </span>

        </a>


        <a
            href="/customers"
            data-path="/customers">

            <span class="sw-icon">
                👥
            </span>

            <span>
                Customers
            </span>

        </a>


        <a
            href="/reports"
            data-path="/reports">

            <span class="sw-icon">
                📈
            </span>

            <span>
                Reports
            </span>

        </a>


        <div class="sw-divider"></div>


        <a
            href="/logout"
            class="sw-logout">

            <span class="sw-icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </a>


    </nav>



    <!-- SIDEBAR FOOTER -->

    <div class="sw-sidebar-footer">

        <div class="sw-status">

            <span class="sw-status-dot"></span>

            <span id="swConnectionText">
                Online
            </span>

        </div>

    </div>

</aside>



<!-- =========================================================
     OVERLAY
     ========================================================= -->

<div
    class="sw-overlay"
    id="swOverlay">
</div>



<!-- =========================================================
     PAGE CONTENT
     ========================================================= -->

{% block content %}{% endblock %}



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

(function () {

    const sidebar =
        document.getElementById(
            "swSidebar"
        );

    const overlay =
        document.getElementById(
            "swOverlay"
        );

    const menuButton =
        document.getElementById(
            "swMenuButton"
        );


    /* =====================================================
       OPEN SIDEBAR
       ===================================================== */

    function openSidebar() {

        sidebar.classList.add("open");

        overlay.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.style.overflow =
            "hidden";
    }


    /* =====================================================
       CLOSE SIDEBAR
       ===================================================== */

    function closeSidebar() {

        sidebar.classList.remove("open");

        overlay.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.style.overflow =
            "";
    }


    /* =====================================================
       MENU BUTTON
       ===================================================== */

    if (menuButton) {

        menuButton.addEventListener(
            "click",
            openSidebar
        );

    }


    /* =====================================================
       OVERLAY
       ===================================================== */

    if (overlay) {

        overlay.addEventListener(
            "click",
            closeSidebar
        );

    }


    /* =====================================================
       CLOSE ON NAVIGATION
       ===================================================== */

    document
        .querySelectorAll(
            ".sw-nav a"
        )
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    if (
                        window.innerWidth <= 768
                    ) {

                        closeSidebar();

                    }

                }
            );

        });


    /* =====================================================
       ESC
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeSidebar();

            }

        }
    );


    /* =====================================================
       ACTIVE MENU
       ===================================================== */

    const currentPath =
        window.location.pathname;


    document
        .querySelectorAll(
            ".sw-nav a[data-path]"
        )
        .forEach(function (link) {

            const path =
                link.getAttribute(
                    "data-path"
                );


            if (
                currentPath === path ||
                currentPath.startsWith(
                    path + "/"
                )
            ) {

                link.classList.add(
                    "active"
                );

            }

        });


    /* =====================================================
       ONLINE / OFFLINE STATUS
       ===================================================== */

    const statusText =
        document.getElementById(
            "swConnectionText"
        );


    function updateConnectionStatus() {

        if (!statusText) {
            return;
        }


        if (navigator.onLine) {

            statusText.textContent =
                "Online";

        } else {

            statusText.textContent =
                "Offline";

        }

    }


    window.addEventListener(
        "online",
        updateConnectionStatus
    );


    window.addEventListener(
        "offline",
        updateConnectionStatus
    );


    updateConnectionStatus();


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function () {

                navigator.serviceWorker
                    .register(
                        "/service-worker.js"
                    )
                    .catch(
                        function (error) {

                            console.warn(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

})();

</script>


</body>

</html>
