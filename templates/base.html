<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <meta name="theme-color" content="#7b3f18">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet"
          href="/static/css/style.css">

    <title>{{ title or 'Sawariya Confectionary' }}</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding-left: 250px;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sawariya-sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 250px;
            height: 100vh;

            background: linear-gradient(
                180deg,
                #24150d 0%,
                #4b2d1d 100%
            );

            color: white;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            overflow-y: auto;

            box-shadow:
                4px 0 18px rgba(0,0,0,0.20);

            transform: translateX(0);

            transition:
                transform 0.28s ease,
                box-shadow 0.28s ease;
        }


        /* =====================================================
           SIDEBAR BUSINESS NAME
           ===================================================== */

        .sawariya-business {
            min-height: 86px;

            display: flex;
            align-items: center;

            padding: 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.12);

            position: relative;
        }


        .sawariya-business-name {
            font-size: 23px;
            font-weight: 900;

            letter-spacing: 1px;

            color: #fff;

            white-space: nowrap;
        }


        .sawariya-business-subtitle {
            margin-top: 4px;

            font-size: 11px;

            color: rgba(255,255,255,0.65);

            letter-spacing: 0.7px;
        }


        /* =====================================================
           CLOSE BUTTON
           ===================================================== */

        .sawariya-close {
            display: none;

            position: absolute;

            top: 17px;
            right: 14px;

            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255,255,255,0.10);

            color: white;

            font-size: 26px;

            cursor: pointer;

            align-items: center;
            justify-content: center;
        }


        /* =====================================================
           MENU
           ===================================================== */

        .sawariya-menu {
            padding: 18px 12px 20px;

            display: flex;
            flex-direction: column;

            gap: 6px;
        }


        .sawariya-menu a {
            display: flex;
            align-items: center;

            min-height: 48px;

            padding: 0 15px;

            border-radius: 10px;

            color:
                rgba(255,255,255,0.88);

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
        }


        .sawariya-menu a:hover {
            background:
                rgba(255,255,255,0.10);

            color: #fff;

            transform: translateX(3px);
        }


        .sawariya-menu a.active {
            background: #7b3f18;

            color: #fff;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.16);
        }


        .sawariya-menu-icon {
            width: 30px;

            margin-right: 8px;

            font-size: 19px;

            text-align: center;
        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        .sawariya-logout {
            margin-top: 10px !important;

            background:
                rgba(220,70,50,0.10);

            color:
                #ffdddd !important;
        }


        .sawariya-logout:hover {
            background:
                rgba(220,70,50,0.22) !important;

            color: #fff !important;
        }


        /* =====================================================
           CENTER HEADER
           ===================================================== */

        .sawariya-top-header {
            position: sticky;

            top: 0;

            width: 100%;

            height: 64px;

            background: #fff;

            z-index: 8000;

            display: flex;

            align-items: center;

            justify-content: center;

            border-bottom:
                1px solid #e5e5e5;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .sawariya-center-name {
            font-size: 25px;

            font-weight: 900;

            letter-spacing: 1.5px;

            color: #7b3f18;

            white-space: nowrap;
        }


        /* =====================================================
           MOBILE MENU BUTTON
           ===================================================== */

        .sawariya-menu-button {
            display: none;

            position: absolute;

            left: 10px;

            width: 44px;
            height: 44px;

            border: none;

            border-radius: 10px;

            background: #24150d;

            color: white;

            font-size: 25px;

            cursor: pointer;

            align-items: center;

            justify-content: center;
        }


        .sawariya-menu-button:active {
            transform: scale(0.95);
        }


        /* =====================================================
           OVERLAY
           ===================================================== */

        .sawariya-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.48);

            z-index: 9998;

            opacity: 0;

            transition:
                opacity 0.25s ease;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 768px) {

            body {
                padding-left: 0;
            }


            .sawariya-sidebar {
                width: 280px;

                transform:
                    translateX(-100%);

                box-shadow: none;
            }


            .sawariya-sidebar.open {
                transform:
                    translateX(0);

                box-shadow:
                    6px 0 25px
                    rgba(0,0,0,0.30);
            }


            .sawariya-close {
                display: flex;
            }


            .sawariya-top-header {
                height: 58px;
            }


            .sawariya-menu-button {
                display: flex;
            }


            .sawariya-center-name {
                font-size: 21px;

                letter-spacing: 1px;
            }


            .sawariya-overlay {
                display: block;

                pointer-events: none;
            }


            .sawariya-overlay.open {
                opacity: 1;

                pointer-events: auto;
            }


            .sawariya-business {
                padding-right: 60px;
            }

        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 380px) {

            .sawariya-sidebar {
                width: 270px;
            }


            .sawariya-center-name {
                font-size: 19px;
            }


            .sawariya-menu a {
                min-height: 46px;

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     TOP HEADER
     ========================================================= -->

<header class="sawariya-top-header">


    <!-- MOBILE HAMBURGER -->

    <button
        type="button"
        class="sawariya-menu-button"
        id="sawariyaMenuButton"
        aria-label="Open menu"
        aria-expanded="false">

        ☰

    </button>


    <!-- CENTER BUSINESS NAME -->

    <div class="sawariya-center-name">
        🍬 SAWARIYA
    </div>


</header>



<!-- =========================================================
     LEFT SIDEBAR
     ========================================================= -->

<aside
    class="sawariya-sidebar"
    id="sawariyaSidebar">


    <!-- BUSINESS NAME INSIDE SIDEBAR -->

    <div class="sawariya-business">

        <div>

            <div class="sawariya-business-name">
                🍬 SAWARIYA
            </div>

            <div class="sawariya-business-subtitle">
                CONFECTIONARY BILLING
            </div>

        </div>


        <!-- MOBILE CLOSE -->

        <button
            type="button"
            class="sawariya-close"
            id="sawariyaCloseButton"
            aria-label="Close menu">

            ×

        </button>

    </div>



    <!-- =====================================================
         MENU
         ===================================================== -->

    <nav class="sawariya-menu">


        <a
            href="/dashboard"
            data-path="/dashboard">

            <span class="sawariya-menu-icon">
                🏠
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <a
            href="/billing"
            data-path="/billing">

            <span class="sawariya-menu-icon">
                🧾
            </span>

            <span>
                Billing
            </span>

        </a>


        <a
            href="/products"
            data-path="/products">

            <span class="sawariya-menu-icon">
                📦
            </span>

            <span>
                Products
            </span>

        </a>


        <a
            href="/stock"
            data-path="/stock">

            <span class="sawariya-menu-icon">
                📊
            </span>

            <span>
                Stock
            </span>

        </a>


        <a
            href="/customers"
            data-path="/customers">

            <span class="sawariya-menu-icon">
                👥
            </span>

            <span>
                Customers
            </span>

        </a>


        <a
            href="/reports"
            data-path="/reports">

            <span class="sawariya-menu-icon">
                📈
            </span>

            <span>
                Reports
            </span>

        </a>


        <a
            href="/logout"
            class="sawariya-logout">

            <span class="sawariya-menu-icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </a>


    </nav>

</aside>



<!-- =========================================================
     OVERLAY
     ========================================================= -->

<div
    class="sawariya-overlay"
    id="sawariyaOverlay">
</div>



<!-- =========================================================
     PAGE CONTENT
     ========================================================= -->

{% block content %}{% endblock %}



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

(function () {

    const sidebar =
        document.getElementById(
            "sawariyaSidebar"
        );

    const overlay =
        document.getElementById(
            "sawariyaOverlay"
        );

    const menuButton =
        document.getElementById(
            "sawariyaMenuButton"
        );

    const closeButton =
        document.getElementById(
            "sawariyaCloseButton"
        );


    /* =====================================================
       OPEN SIDEBAR
       ===================================================== */

    function openSidebar() {

        sidebar.classList.add("open");

        overlay.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.style.overflow =
            "hidden";
    }


    /* =====================================================
       CLOSE SIDEBAR
       ===================================================== */

    function closeSidebar() {

        sidebar.classList.remove("open");

        overlay.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.style.overflow =
            "";
    }


    /* =====================================================
       BUTTON EVENTS
       ===================================================== */

    if (menuButton) {

        menuButton.addEventListener(
            "click",
            openSidebar
        );

    }


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closeSidebar
        );

    }


    if (overlay) {

        overlay.addEventListener(
            "click",
            closeSidebar
        );

    }


    /* =====================================================
       CLOSE AFTER MENU CLICK
       ===================================================== */

    document
        .querySelectorAll(
            ".sawariya-menu a"
        )
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    if (
                        window.innerWidth <= 768
                    ) {

                        closeSidebar();

                    }

                }
            );

        });


    /* =====================================================
       ESC KEY
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeSidebar();

            }

        }
    );


    /* =====================================================
       ACTIVE MENU
       ===================================================== */

    const currentPath =
        window.location.pathname;


    document
        .querySelectorAll(
            ".sawariya-menu a[data-path]"
        )
        .forEach(function (link) {

            const path =
                link.getAttribute(
                    "data-path"
                );


            if (
                currentPath === path ||
                currentPath.startsWith(
                    path + "/"
                )
            ) {

                link.classList.add(
                    "active"
                );

            }

        });


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function () {

                navigator.serviceWorker
                    .register(
                        "/service-worker.js"
                    )
                    .catch(
                        function (error) {

                            console.warn(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

})();

</script>


</body>

</html>
