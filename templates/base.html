<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#7b3f18">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <!-- PWA Manifest -->
    <link rel="manifest"
          href="/manifest.json">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="/static/css/style.css">

    <title>
        {{ title or 'Sawariya Confectionary' }}
    </title>
</head>


<body>

<nav>

    <div class="logo">
        🍬 SAWARIYA
    </div>

    <div class="links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/billing">
            Billing
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/stock">
            Stock
        </a>

        <a href="/customers">
            Customers
        </a>

        <a href="/reports">
            Reports
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


{% block content %}

{% endblock %}


<!-- =====================================================
     SAWARIYA OFFLINE DATABASE
     Must load before other page JavaScript
     ===================================================== -->

<script src="/static/js/offline-db.js"></script>


<!-- =====================================================
     SERVICE WORKER
     ===================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", async () => {

        try {

            const registration =
                await navigator.serviceWorker.register(
                    "/service-worker.js",
                    {
                        scope: "/"
                    }
                );

            console.log(
                "Sawariya Service Worker registered:",
                registration.scope
            );

            /*
             * Once the user is logged in and the current page
             * is available online, ask the Service Worker to
             * cache the main application pages.
             */

            if (navigator.serviceWorker.controller) {

                navigator.serviceWorker.controller.postMessage({
                    type: "CACHE_APP_PAGES"
                });

            } else {

                navigator.serviceWorker.ready.then(worker => {

                    if (worker.active) {

                        worker.active.postMessage({
                            type: "CACHE_APP_PAGES"
                        });

                    }

                });

            }

        } catch (error) {

            console.error(
                "Sawariya Service Worker registration failed:",
                error
            );

        }

    });

}

</script>


</body>
</html>
