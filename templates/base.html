<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <meta name="theme-color" content="#24150d">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet"
          href="/static/css/style.css">

    <title>{{ title or 'Sawariya Confectionary' }}</title>


    <style>

        /* =========================================================
           GLOBAL
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding-left: 270px;

            background: #f7f7f8;
        }


        /* =========================================================
           PREMIUM SIDEBAR
           ========================================================= */

        .sw-sidebar {

            position: fixed;

            top: 14px;
            left: 14px;

            width: 242px;
            height: calc(100vh - 28px);

            padding: 12px;

            border-radius: 22px;

            background:
                linear-gradient(
                    160deg,
                    #24150d 0%,
                    #321b10 48%,
                    #4b2d1d 100%
                );

            color: #fff;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 18px 45px rgba(36,21,13,0.24),
                inset 0 1px 0 rgba(255,255,255,0.08);

            overflow: hidden;

            transform: translateX(0);

            transition:
                transform .3s cubic-bezier(.4,0,.2,1),
                box-shadow .3s ease;
        }


        /* =========================================================
           DECORATIVE GLOW
           ========================================================= */

        .sw-sidebar::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -90px;
            right: -70px;

            border-radius: 50%;

            background:
                rgba(198,116,48,0.18);

            filter: blur(2px);

            pointer-events: none;
        }


        .sw-sidebar::after {

            content: "";

            position: absolute;

            width: 140px;
            height: 140px;

            bottom: -80px;
            left: -70px;

            border-radius: 50%;

            background:
                rgba(255,190,100,0.07);

            pointer-events: none;
        }


        /* =========================================================
           BRAND AREA
           ========================================================= */

        .sw-brand {

            position: relative;

            min-height: 92px;

            padding: 13px 12px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.10),
                    rgba(255,255,255,0.035)
                );

            border:
                1px solid rgba(255,255,255,0.10);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.07);

            display: flex;

            align-items: center;

            gap: 11px;
        }


        .sw-brand-icon {

            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #a65d27,
                    #7b3f18
                );

            font-size: 23px;

            box-shadow:
                0 7px 16px rgba(0,0,0,0.20);
        }


        .sw-brand-text {

            min-width: 0;
        }


        .sw-brand-name {

            font-size: 19px;

            line-height: 1.1;

            font-weight: 900;

            letter-spacing: 1px;

            color: #fff;
        }


        .sw-brand-subtitle {

            margin-top: 5px;

            font-size: 9px;

            line-height: 1;

            letter-spacing: 1.2px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.55);
        }


        /* =========================================================
           MOBILE CLOSE
           ========================================================= */

        .sw-close {

            display: none;

            position: absolute;

            top: 10px;
            right: 10px;

            width: 30px;
            height: 30px;

            border: 0;

            border-radius: 9px;

            background:
                rgba(255,255,255,0.08);

            color: rgba(255,255,255,0.8);

            font-size: 21px;

            cursor: pointer;

            align-items: center;
            justify-content: center;
        }


        /* =========================================================
           MENU LABEL
           ========================================================= */

        .sw-menu-label {

            padding:

                22px 10px
                9px;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.38);
        }


        /* =========================================================
           MENU
           ========================================================= */

        .sw-menu {

            position: relative;

            flex: 1;

            overflow-y: auto;

            padding: 0 1px 8px;

            scrollbar-width: thin;

            scrollbar-color:
                rgba(255,255,255,.15)
                transparent;
        }


        .sw-menu::-webkit-scrollbar {
            width: 4px;
        }

        .sw-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .sw-menu::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,0.15);

            border-radius: 20px;
        }


        /* =========================================================
           MENU ITEM
           ========================================================= */

        .sw-menu a {

            position: relative;

            min-height: 47px;

            margin: 4px 0;

            padding: 0 12px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            gap: 11px;

            color:
                rgba(255,255,255,0.70);

            text-decoration: none;

            font-size: 13px;

            font-weight: 650;

            letter-spacing: .15px;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }


        .sw-menu a:hover {

            color: #fff;

            background:
                rgba(255,255,255,0.075);

            transform:
                translateX(2px);
        }


        /* =========================================================
           ICON BOX
           ========================================================= */

        .sw-icon {

            width: 34px;
            height: 34px;

            flex: 0 0 34px;

            border-radius: 10px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,0.055);

            font-size: 16px;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        .sw-menu a:hover .sw-icon {

            background:
                rgba(255,255,255,0.10);

            transform:
                scale(1.04);
        }


        /* =========================================================
           ACTIVE ITEM
           ========================================================= */

        .sw-menu a.active {

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #8e4b1e,
                    #6f3515
                );

            box-shadow:
                0 8px 18px
                rgba(123,63,24,0.28),
                inset 0 1px 0
                rgba(255,255,255,0.10);
        }


        .sw-menu a.active .sw-icon {

            background:
                rgba(255,255,255,0.13);
        }


        .sw-menu a.active::before {

            content: "";

            position: absolute;

            left: -1px;

            top: 9px;
            bottom: 9px;

            width: 3px;

            border-radius: 0 4px 4px 0;

            background: #f3c58b;
        }


        /* =========================================================
           DIVIDER
           ========================================================= */

        .sw-divider {

            height: 1px;

            margin: 10px 7px;

            background:
                rgba(255,255,255,0.08);
        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        .sw-logout {

            margin-top: 2px !important;

            color:
                rgba(255,220,215,0.75) !important;
        }


        .sw-logout:hover {

            background:
                rgba(210,65,50,0.13) !important;

            color: #fff !important;
        }


        /* =========================================================
           TOP HEADER
           ========================================================= */

        .sw-topbar {

            position: sticky;

            top: 0;

            height: 68px;

            width: 100%;

            z-index: 8000;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(255,255,255,0.92);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-bottom:
                1px solid #ececef;
        }


        /* =========================================================
           CENTER BRAND
           ========================================================= */

        .sw-center-brand {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            color: #7b3f18;

            font-size: 22px;

            font-weight: 950;

            letter-spacing: 1.7px;
        }


        .sw-center-brand span {

            font-size: 21px;
        }


        /* =========================================================
           MOBILE MENU BUTTON
           ========================================================= */

        .sw-menu-button {

            display: none;

            position: absolute;

            left: 10px;

            width: 42px;
            height: 42px;

            border: 0;

            border-radius: 12px;

            background:
                #24150d;

            color: #fff;

            font-size: 22px;

            cursor: pointer;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 14px
                rgba(36,21,13,.20);
        }


        .sw-menu-button:active {

            transform:
                scale(.94);
        }


        /* =========================================================
           OVERLAY
           ========================================================= */

        .sw-overlay {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9998;

            background:
                rgba(20,12,8,.48);

            backdrop-filter:
                blur(2px);

            -webkit-backdrop-filter:
                blur(2px);

            opacity: 0;

            transition:
                opacity .25s ease;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            body {
                padding-left: 0;
            }


            .sw-topbar {

                height: 58px;
            }


            .sw-menu-button {

                display: flex;
            }


            .sw-center-brand {

                font-size: 19px;

                letter-spacing: 1.1px;
            }


            .sw-center-brand span {

                font-size: 18px;
            }


            .sw-sidebar {

                top: 8px;
                left: 8px;

                width: 286px;

                height:
                    calc(100vh - 16px);

                border-radius: 22px;

                transform:
                    translateX(-110%);

                box-shadow: none;
            }


            .sw-sidebar.open {

                transform:
                    translateX(0);

                box-shadow:
                    10px 20px 45px
                    rgba(0,0,0,.30);
            }


            .sw-close {

                display: flex;
            }


            .sw-overlay {

                display: block;

                pointer-events: none;
            }


            .sw-overlay.open {

                opacity: 1;

                pointer-events: auto;
            }


            .sw-brand {

                min-height: 88px;
            }

        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 380px) {

            .sw-sidebar {

                width: 276px;
            }


            .sw-center-brand {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     TOP BAR
     ========================================================= -->

<header class="sw-topbar">


    <!-- MOBILE MENU -->

    <button
        type="button"
        class="sw-menu-button"
        id="swMenuButton"
        aria-label="Open menu"
        aria-expanded="false">

        ☰

    </button>


    <!-- CENTER BUSINESS NAME -->

    <div class="sw-center-brand">

        <span>🍬</span>

        <strong>SAWARIYA</strong>

    </div>

</header>



<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<aside
    class="sw-sidebar"
    id="swSidebar">


    <!-- BRAND -->

    <div class="sw-brand">


        <div class="sw-brand-icon">
            🍬
        </div>


        <div class="sw-brand-text">

            <div class="sw-brand-name">
                SAWARIYA
            </div>

            <div class="sw-brand-subtitle">
                Confectionary Billing
            </div>

        </div>


        <!-- CLOSE -->

        <button
            type="button"
            class="sw-close"
            id="swCloseButton"
            aria-label="Close menu">

            ×

        </button>

    </div>



    <!-- MENU TITLE -->

    <div class="sw-menu-label">
        Main Menu
    </div>



    <!-- MENU -->

    <nav class="sw-menu">


        <a
            href="/dashboard"
            data-path="/dashboard">

            <span class="sw-icon">
                🏠
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <a
            href="/billing"
            data-path="/billing">

            <span class="sw-icon">
                🧾
            </span>

            <span>
                Billing
            </span>

        </a>


        <a
            href="/products"
            data-path="/products">

            <span class="sw-icon">
                📦
            </span>

            <span>
                Products
            </span>

        </a>


        <a
            href="/stock"
            data-path="/stock">

            <span class="sw-icon">
                📊
            </span>

            <span>
                Stock
            </span>

        </a>


        <a
            href="/customers"
            data-path="/customers">

            <span class="sw-icon">
                👥
            </span>

            <span>
                Customers
            </span>

        </a>


        <a
            href="/reports"
            data-path="/reports">

            <span class="sw-icon">
                📈
            </span>

            <span>
                Reports
            </span>

        </a>


        <div class="sw-divider"></div>


        <a
            href="/logout"
            class="sw-logout">

            <span class="sw-icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </a>


    </nav>

</aside>



<!-- =========================================================
     OVERLAY
     ========================================================= -->

<div
    class="sw-overlay"
    id="swOverlay">
</div>



<!-- =========================================================
     PAGE CONTENT
     ========================================================= -->

{% block content %}{% endblock %}



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

(function () {

    const sidebar =
        document.getElementById(
            "swSidebar"
        );

    const overlay =
        document.getElementById(
            "swOverlay"
        );

    const menuButton =
        document.getElementById(
            "swMenuButton"
        );

    const closeButton =
        document.getElementById(
            "swCloseButton"
        );


    /* =====================================================
       OPEN
       ===================================================== */

    function openSidebar() {

        sidebar.classList.add("open");

        overlay.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

        document.body.style.overflow =
            "hidden";
    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeSidebar() {

        sidebar.classList.remove("open");

        overlay.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        document.body.style.overflow =
            "";
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    if (menuButton) {

        menuButton.addEventListener(
            "click",
            openSidebar
        );

    }


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closeSidebar
        );

    }


    if (overlay) {

        overlay.addEventListener(
            "click",
            closeSidebar
        );

    }


    /* =====================================================
       MENU CLICK
       ===================================================== */

    document
        .querySelectorAll(
            ".sw-menu a"
        )
        .forEach(function (link) {

            link.addEventListener(
                "click",
                function () {

                    if (
                        window.innerWidth <= 768
                    ) {

                        closeSidebar();

                    }

                }
            );

        });


    /* =====================================================
       ESC
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeSidebar();

            }

        }
    );


    /* =====================================================
       ACTIVE PAGE
       ===================================================== */

    const currentPath =
        window.location.pathname;


    document
        .querySelectorAll(
            ".sw-menu a[data-path]"
        )
        .forEach(function (link) {

            const path =
                link.getAttribute(
                    "data-path"
                );


            if (
                currentPath === path ||
                currentPath.startsWith(
                    path + "/"
                )
            ) {

                link.classList.add(
                    "active"
                );

            }

        });


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function () {

                navigator.serviceWorker
                    .register(
                        "/service-worker.js"
                    )
                    .catch(
                        function (error) {

                            console.warn(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

})();

</script>


</body>

</html>
