<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <meta name="theme-color" content="#0759a8">

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <title>
        {{ title or 'Billing App' }}
    </title>


    <style>

        /* =====================================================
           SAWARIYA BILLING
           KHATABOOK STYLE MOBILE LAYOUT
           ===================================================== */

        :root {

            --app-blue: #0759a8;
            --app-blue-dark: #064c91;

            --app-bg: #f5f7fa;

            --app-text: #202124;
            --app-muted: #707780;

            --app-border: #e2e5e9;

            --app-white: #ffffff;

            --app-danger: #b3263e;

            --app-green: #168c45;

        }


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        html,
        body {

            width: 100%;

            min-width: 0;

            margin: 0;

            padding: 0;

            background: var(--app-bg);

        }


        body {

            color: var(--app-text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            padding-bottom:
                calc(
                    72px +
                    env(safe-area-inset-bottom)
                ) !important;

            overflow-x: hidden;

        }


        /* =====================================================
           TOP HEADER
           ===================================================== */

        .app-header {

            width: 100%;

            min-height: 108px;

            background: var(--app-blue);

            color: #fff;

            padding:
                max(12px, env(safe-area-inset-top))
                20px
                12px;

            position: relative;

            z-index: 1000;

        }


        .app-header-top {

            min-height: 80px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

        }


        /* =====================================================
           BUSINESS
           ===================================================== */

        .business-section {

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .business-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            flex-shrink: 0;

        }


        .business-info {

            min-width: 0;

        }


        .business-name {

            max-width: 250px;

            font-size: 18px;

            font-weight: 700;

            line-height: 1.25;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .business-owner {

            margin-top: 4px;

            font-size: 12px;

            opacity: .82;

        }


        .business-arrow {

            font-size: 18px;

            margin-left: 3px;

        }


        /* =====================================================
           ACCOUNT BUTTON
           ===================================================== */

        .header-account {

            width: 58px;

            height: 56px;

            border: 1px solid
                rgba(255,255,255,.55);

            border-radius: 50%;

            background:
                rgba(255,255,255,.05);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            text-decoration: none;

            font-size: 26px;

            flex-shrink: 0;

        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {

            width: 100%;

            min-height: calc(100vh - 108px);

        }


        /* =====================================================
           FIXED BOTTOM NAV
           ONLY 3 ITEMS
           ===================================================== */

        .bottom-nav {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            width: 100%;

            height:
                calc(
                    70px +
                    env(safe-area-inset-bottom)
                );

            padding-bottom:
                env(safe-area-inset-bottom);

            background: #fff;

            border-top: 1px solid
                var(--app-border);

            box-shadow:
                0 -3px 15px
                rgba(0,0,0,.09);

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            z-index: 9998;

        }


        .bottom-nav-item {

            min-width: 0;

            height: 70px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            text-decoration: none;

            color: #68717a;

            font-size: 11px;

            font-weight: 600;

            position: relative;

            cursor: pointer;

            background: transparent;

            border: 0;

        }


        .bottom-nav-icon {

            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            line-height: 1;

        }


        .bottom-nav-label {

            line-height: 1;

        }


        .bottom-nav-item.active {

            color: var(--app-blue);

        }


        .bottom-nav-item.active::before {

            content: "";

            position: absolute;

            top: 0;

            left: 50%;

            transform:
                translateX(-50%);

            width: 38px;

            height: 3px;

            border-radius:
                0 0 5px 5px;

            background: #ffd447;

        }


        /* =====================================================
           BILLING CENTER BUTTON
           ===================================================== */

        .billing-nav {

            position: relative;

        }


        .billing-circle {

            width: 48px;

            height: 48px;

            margin-top: -20px;

            border-radius: 50%;

            background: var(--app-blue);

            color: #fff;

            border: 4px solid #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,.22);

        }


        .billing-nav .bottom-nav-label {

            margin-top: 2px;

        }


        /* =====================================================
           MORE OVERLAY
           ===================================================== */

        .more-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.45);

            display: none;

            align-items: flex-end;

            justify-content: center;

            z-index: 20000;

        }


        .more-overlay.show {

            display: flex;

        }


        /* =====================================================
           MORE SHEET
           ===================================================== */

        .more-sheet {

            width: 100%;

            max-width: 650px;

            max-height: 86vh;

            overflow-y: auto;

            background: #fff;

            border-radius:
                22px 22px 0 0;

            padding:
                10px
                14px
                calc(
                    24px +
                    env(safe-area-inset-bottom)
                );

            box-shadow:
                0 -5px 25px
                rgba(0,0,0,.20);

            animation:
                moreSheetUp
                .22s ease;

        }


        @keyframes moreSheetUp {

            from {

                transform:
                    translateY(100%);

            }

            to {

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           SHEET HANDLE
           ===================================================== */

        .more-handle {

            width: 44px;

            height: 4px;

            border-radius: 10px;

            background: #d4d7da;

            margin:
                3px auto
                14px;

        }


        /* =====================================================
           MORE HEADER
           ===================================================== */

        .more-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 4px
                10px
                14px;

        }


        .more-header h2 {

            margin: 0;

            font-size: 20px;

            font-weight: 700;

        }


        .more-close {

            width: 36px;

            height: 36px;

            border: 0;

            border-radius: 50%;

            background: #f1f3f5;

            color: #555;

            font-size: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           MORE MENU GRID
           ===================================================== */

        .more-menu {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 9px;

            padding: 5px 0;

        }


        .more-item {

            min-height: 82px;

            border: 1px solid #e6e8eb;

            border-radius: 13px;

            background: #fafbfc;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 7px;

            color: #30343a;

            text-decoration: none;

            cursor: pointer;

        }


        .more-item:active {

            transform: scale(.97);

            background: #f1f4f7;

        }


        .more-icon {

            width: 29px;

            height: 29px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

        }


        .more-label {

            font-size: 11px;

            font-weight: 600;

            text-align: center;

        }


        /* =====================================================
           MORE SEPARATOR
           ===================================================== */

        .more-separator {

            height: 1px;

            background: #eeeeee;

            margin:
                13px 2px;

        }


        /* =====================================================
           SETTINGS ROWS
           ===================================================== */

        .more-setting {

            min-height: 53px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                7px 7px;

            border-bottom:
                1px solid #f0f1f2;

        }


        .more-setting:last-child {

            border-bottom: 0;

        }


        .setting-left {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .setting-icon {

            width: 34px;

            height: 34px;

            border-radius: 9px;

            background: #f1f4f7;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

        }


        .setting-name {

            font-size: 14px;

            font-weight: 600;

        }


        .setting-value {

            color: #747b83;

            font-size: 12px;

        }


        /* =====================================================
           THEME SWITCH
           ===================================================== */

        .theme-switch {

            width: 48px;

            height: 28px;

            border: 0;

            border-radius: 20px;

            background: #cfd4d9;

            padding: 3px;

            position: relative;

            cursor: pointer;

        }


        .theme-switch::after {

            content: "";

            width: 22px;

            height: 22px;

            border-radius: 50%;

            background: #fff;

            position: absolute;

            top: 3px;

            left: 3px;

            transition:
                left .2s ease;

        }


        .theme-switch.dark {

            background:
                var(--app-blue);

        }


        .theme-switch.dark::after {

            left: 23px;

        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        .logout-item {

            width: 100%;

            min-height: 51px;

            margin-top: 8px;

            border: 1px solid #f0d7dc;

            border-radius: 11px;

            background: #fff7f8;

            color: var(--app-danger);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        body.dark-mode {

            background: #111820;

            color: #f2f4f6;

        }


        body.dark-mode .more-sheet {

            background: #1b232c;

            color: #fff;

        }


        body.dark-mode .more-item {

            background: #222c36;

            border-color: #313b45;

            color: #fff;

        }


        body.dark-mode .more-setting {

            border-color: #303942;

        }


        body.dark-mode .setting-icon {

            background: #29333d;

        }


        body.dark-mode .more-separator {

            background: #303942;

        }


        body.dark-mode .more-close {

            background: #29333d;

            color: #fff;

        }


        /* =====================================================
           DESKTOP
           ===================================================== */

        @media (min-width: 701px) {

            .app-header {

                display: none;

            }


            .bottom-nav {

                display: none;

            }


            body {

                padding-bottom: 0 !important;

            }


            main {

                min-height: 100vh;

            }


            .more-overlay {

                align-items: center;

            }


            .more-sheet {

                border-radius: 18px;

                margin: 20px;

            }

        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media (max-width: 380px) {

            .app-header {

                padding-left: 14px;

                padding-right: 14px;

            }


            .business-name {

                max-width: 190px;

                font-size: 17px;

            }


            .more-menu {

                gap: 7px;

            }


            .more-item {

                min-height: 76px;

            }


            .more-label {

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BUSINESS HEADER
         ===================================================== -->

    <header class="app-header">

        <div class="app-header-top">


            <div class="business-section">


                <div class="business-icon">
                    🏪
                </div>


                <div class="business-info">


                    <div class="business-name">

                        {{ business_name or 'My Business' }}

                        <span class="business-arrow">
                            ▼
                        </span>

                    </div>


                    <div class="business-owner">

                        {{ username or 'admin' }}

                    </div>


                </div>


            </div>


            <a
                href="/logout"
                class="header-account"
                aria-label="Account"
            >
                👤
            </a>


        </div>

    </header>


    <!-- =====================================================
         MAIN PAGE
         ===================================================== -->

    <main>

        {% block content %}{% endblock %}

    </main>


    <!-- =====================================================
         FIXED BOTTOM NAVIGATION
         ONLY 3 ITEMS
         ===================================================== -->

    <nav class="bottom-nav">


        <!-- DASHBOARD -->

        <a
            href="/dashboard"
            class="bottom-nav-item
            {% if request.url.path == '/dashboard' %}
                active
            {% endif %}"
        >

            <div class="bottom-nav-icon">
                🏠
            </div>

            <div class="bottom-nav-label">
                Dashboard
            </div>

        </a>


        <!-- BILLING -->

        <a
            href="/billing"
            class="bottom-nav-item billing-nav
            {% if request.url.path == '/billing' %}
                active
            {% endif %}"
        >

            <div class="billing-circle">
                ＋
            </div>

            <div class="bottom-nav-label">
                Billing
            </div>

        </a>


        <!-- MORE -->

        <button
            type="button"
            class="bottom-nav-item"
            onclick="openMoreMenu()"
        >

            <div class="bottom-nav-icon">
                ⋯
            </div>

            <div class="bottom-nav-label">
                More
            </div>

        </button>


    </nav>


    <!-- =====================================================
         MORE MENU OVERLAY
         ===================================================== -->

    <div
        class="more-overlay"
        id="moreOverlay"
        onclick="closeMoreMenu(event)"
    >


        <div
            class="more-sheet"
            onclick="event.stopPropagation()"
        >


            <div class="more-handle"></div>


            <!-- HEADER -->

            <div class="more-header">

                <h2>
                    More
                </h2>

                <button
                    type="button"
                    class="more-close"
                    onclick="closeMoreMenu()"
                >
                    ×
                </button>

            </div>


            <!-- =================================================
                 MAIN MORE MENU
                 ================================================= -->

            <div class="more-menu">


                <!-- CUSTOMERS -->

                <a
                    href="/customers"
                    class="more-item"
                >

                    <div class="more-icon">
                        👥
                    </div>

                    <div class="more-label">
                        Customers
                    </div>

                </a>


                <!-- SUPPLIERS -->

                <a
                    href="/suppliers"
                    class="more-item"
                >

                    <div class="more-icon">
                        🚚
                    </div>

                    <div class="more-label">
                        Suppliers
                    </div>

                </a>


                <!-- PRODUCTS -->

                <a
                    href="/products"
                    class="more-item"
                >

                    <div class="more-icon">
                        📦
                    </div>

                    <div class="more-label">
                        Products
                    </div>

                </a>


                <!-- STOCK -->

                <a
                    href="/stock"
                    class="more-item"
                >

                    <div class="more-icon">
                        📋
                    </div>

                    <div class="more-label">
                        Stock
                    </div>

                </a>


                <!-- REPORTS -->

                <a
                    href="/reports"
                    class="more-item"
                >

                    <div class="more-icon">
                        📊
                    </div>

                    <div class="more-label">
                        Reports
                    </div>

                </a>


                <!-- CASHBOOK -->

                <a
                    href="/reports"
                    class="more-item"
                >

                    <div class="more-icon">
                        💰
                    </div>

                    <div class="more-label">
                        Cashbook
                    </div>

                </a>


                <!-- STAFF -->

                <a
                    href="/staff"
                    class="more-item"
                >

                    <div class="more-icon">
                        👨‍💼
                    </div>

                    <div class="more-label">
                        Staff
                    </div>

                </a>


                <!-- SETTINGS -->

                <a
                    href="/settings"
                    class="more-item"
                >

                    <div class="more-icon">
                        ⚙️
                    </div>

                    <div class="more-label">
                        Settings
                    </div>

                </a>


                <!-- BUSINESS -->

                <a
                    href="/settings"
                    class="more-item"
                >

                    <div class="more-icon">
                        🏪
                    </div>

                    <div class="more-label">
                        Business
                    </div>

                </a>


            </div>


            <!-- =================================================
                 SETTINGS
                 ================================================= -->

            <div class="more-separator"></div>


            <!-- LANGUAGE -->

            <div class="more-setting">


                <div class="setting-left">

                    <div class="setting-icon">
                        🌐
                    </div>

                    <div>

                        <div class="setting-name">
                            Language
                        </div>

                        <div
                            class="setting-value"
                            id="languageValue"
                        >
                            English
                        </div>

                    </div>

                </div>


                <select
                    id="languageSelect"
                    onchange="changeLanguage(this.value)"
                    style="
                        border:1px solid #dfe3e8;
                        border-radius:8px;
                        padding:7px 8px;
                        background:#fff;
                        font-size:12px;
                    "
                >

                    <option value="en">
                        English
                    </option>

                    <option value="hi">
                        हिन्दी
                    </option>

                </select>


            </div>


            <!-- THEME -->

            <div class="more-setting">


                <div class="setting-left">

                    <div class="setting-icon">
                        🌙
                    </div>

                    <div>

                        <div class="setting-name">
                            Dark Theme
                        </div>

                        <div
                            class="setting-value"
                            id="themeText"
                        >
                            Off
                        </div>

                    </div>

                </div>


                <button
                    type="button"
                    id="themeSwitch"
                    class="theme-switch"
                    onclick="toggleTheme()"
                    aria-label="Toggle theme"
                ></button>


            </div>


            <!-- LOGOUT -->

            <a
                href="/logout"
                class="logout-item"
            >

                <span>
                    🚪
                </span>

                Logout

            </a>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           MORE MENU
           ===================================================== */

        function openMoreMenu() {

            const overlay =
                document.getElementById(
                    "moreOverlay"
                );

            if (!overlay) return;

            overlay.classList.add("show");

            document.body.style.overflow =
                "hidden";

        }


        function closeMoreMenu(event) {

            if (
                event &&
                event.target !==
                event.currentTarget
            ) {

                return;

            }


            const overlay =
                document.getElementById(
                    "moreOverlay"
                );

            if (!overlay) return;

            overlay.classList.remove("show");

            document.body.style.overflow =
                "";

        }


        /* =====================================================
           ESCAPE
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeMoreMenu();

                }

            }
        );


        /* =====================================================
           DARK THEME
           ===================================================== */

        function applyTheme() {

            const dark =
                localStorage.getItem(
                    "sawariya_theme"
                ) === "dark";


            const switchButton =
                document.getElementById(
                    "themeSwitch"
                );

            const themeText =
                document.getElementById(
                    "themeText"
                );


            if (dark) {

                document.body.classList.add(
                    "dark-mode"
                );


                if (switchButton) {

                    switchButton.classList.add(
                        "dark"
                    );

                }


                if (themeText) {

                    themeText.textContent =
                        "On";

                }

            } else {

                document.body.classList.remove(
                    "dark-mode"
                );


                if (switchButton) {

                    switchButton.classList.remove(
                        "dark"
                    );

                }


                if (themeText) {

                    themeText.textContent =
                        "Off";

                }

            }

        }


        function toggleTheme() {

            const current =
                localStorage.getItem(
                    "sawariya_theme"
                );


            if (current === "dark") {

                localStorage.setItem(
                    "sawariya_theme",
                    "light"
                );

            } else {

                localStorage.setItem(
                    "sawariya_theme",
                    "dark"
                );

            }


            applyTheme();

        }


        /* =====================================================
           LANGUAGE
           ===================================================== */

        function changeLanguage(value) {

            localStorage.setItem(
                "sawariya_language",
                value
            );


            const languageValue =
                document.getElementById(
                    "languageValue"
                );


            if (!languageValue) return;


            if (value === "hi") {

                languageValue.textContent =
                    "हिन्दी";

            } else {

                languageValue.textContent =
                    "English";

            }

        }


        function applyLanguage() {

            const saved =
                localStorage.getItem(
                    "sawariya_language"
                ) || "en";


            const select =
                document.getElementById(
                    "languageSelect"
                );


            const languageValue =
                document.getElementById(
                    "languageValue"
                );


            if (select) {

                select.value = saved;

            }


            if (languageValue) {

                languageValue.textContent =
                    saved === "hi"
                        ? "हिन्दी"
                        : "English";

            }

        }


        /* =====================================================
           START
           ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                applyTheme();

                applyLanguage();

            }
        );


    </script>


</body>

</html>
