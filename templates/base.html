    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >


    <!-- PWA Manifest -->

    <link
        rel="manifest"
        href="/manifest.json"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >


    <title>
        {{ title or 'Sawariya Confectionary' }}
    </title>

</head>


<body>


<nav>

    <div class="logo">
        🍬 SAWARIYA
    </div>


    <div class="links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/billing">
            Billing
        </a>

        <a href="/products">
            Products
        </a>

        <a href="/stock">

        </a>

        <a href="/reports">
            Reports
        </a>

            Logout
        </a>

    </div>

</nav>


{% block content %}
{% endblock %}


<!-- =====================================================
     OFFLINE DATABASE
     ===================================================== -->

<script src="/static/js/offline-db.js"></script>


<!-- =====================================================
     SERVICE WORKER
     ===================================================== -->

<script>

window.addEventListener("load", async () => {

    if (!("serviceWorker" in navigator)) {
        return;
    }

    try {

        const registration =
            await navigator.serviceWorker.register(
                "/service-worker.js"
            );

        console.log(
            "Service Worker Registered"
        );

        const readyRegistration =
            await navigator.serviceWorker.ready;


        /*
         ACTIVE SERVICE WORKER KO
         SAB APP PAGES CACHE KARNE BOLO
        */

        if (readyRegistration.active) {

            readyRegistration.active.postMessage({
                type: "CACHE_APP_PAGES"
            });

        }


        /*
         AGAR NAYA SERVICE WORKER
         CONTROL LE TO DOBARA CACHE MESSAGE BHEJO
        */

        navigator.serviceWorker.addEventListener(
            "controllerchange",
            () => {

                if (
                    navigator.serviceWorker.controller
                ) {

                    navigator.serviceWorker.controller.postMessage({
                        type: "CACHE_APP_PAGES"
                    });

                }

            }
        );


    } catch (error) {

        console.error(
            "Service Worker Error:",
            error
        );

    }

});

</script>


</body>

</html>
