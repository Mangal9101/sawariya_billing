<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7b3f18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/css/style.css">
<title>{{ title or 'Sawariya Confectionary' }}</title>
</head>
<body>
<nav>
<div class="logo">🍬 SAWARIYA</div>
<div class="links">
<a href="/dashboard">Dashboard</a><a href="/billing">Billing</a><a href="/products">Products</a><a href="/stock">Stock</a><a href="/customers">Customers</a><a href="/reports">Reports</a><a href="/logout">Logout</a>
</div>
</nav>
{% block content %}{% endblock %}
<script src="/static/js/offline-db.js"></script>
<script>
if ("serviceWorker" in navigator) {
window.addEventListener("load", async function () {
try {
const registration = await navigator.serviceWorker.register("/service-worker.js");
console.log("SERVICE WORKER REGISTERED");
navigator.serviceWorker.ready.then(function (registration) {
if (registration.active) registration.active.postMessage({type:"CACHE_APP_PAGES"});
});
} catch (error) { console.error("SERVICE WORKER ERROR:", error); }
});
}
</script>
</body>
</html>
