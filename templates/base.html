{% block content %}

<!-- =====================================================
     SAWARIYA OFFLINE DATABASE
     Must load before other page JavaScript
     ===================================================== -->

<script src="/static/js/offline-db.js"></script>


<!-- =====================================================
     SERVICE WORKER
     ===================================================== -->


<script>

window.addEventListener(
    "load",
    async () => {

        if (
            "serviceWorker" in navigator
        ) {

            try {

                const registration =
                    await navigator
                        .serviceWorker
                        .register(
                            "/service-worker.js"
                        );


                console.log(
                    "Service Worker Registered"
                );


                /*
                 Service worker active hone ka wait
                */

                await navigator
                    .serviceWorker
                    .ready;


                /*
                 Sab pages cache karo
                */

                if (
                    navigator.serviceWorker.controller
                ) {

                    navigator
                        .serviceWorker
                        .controller
                        .postMessage({

                            type:
                                "CACHE_APP_PAGES"

                        });

                }

            }

            catch (error) {

                console.error(
                    "Service Worker Error:",
                    error
                );

            }

        }

    }
);

</script>


</body>
</html>
